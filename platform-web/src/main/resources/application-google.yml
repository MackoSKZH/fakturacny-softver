# Prihlasenie Google uctom (napr. Google Workspace for Nonprofits).
# Aktivacia: SPRING_PROFILES_ACTIVE=google + GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, APP_ALLOWED_EMAILS
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

app:
  security:
    mode: google
