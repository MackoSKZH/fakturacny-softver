<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sk">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | FIRST Global Slovakia HQ'">FIRST Global Slovakia HQ</title>
    <meta name="csrf-token" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="csrf-header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav(active)" class="topbar">
    <a class="brand" th:href="@{/}">FGS <span>HQ</span></a>
    <nav>
        <a th:href="@{/aktivity}" th:classappend="${active == 'aktivity' or active == 'projekty'} ? 'active'">Aktivity</a>
        <a th:href="@{/moj-program}" th:classappend="${active == 'program'} ? 'active'">Môj program</a>
        <a th:if="${canEdit}" th:href="@{/ludia}" th:classappend="${active == 'ludia'} ? 'active'">Ľudia</a>
        <a th:if="${canEdit}" th:href="@{/partneri}" th:classappend="${active == 'partneri'} ? 'active'">Partneri</a>
        <a th:href="@{/financovanie}" th:classappend="${active == 'financovanie'} ? 'active'">Financovanie</a>
        <a th:if="${canEdit}" th:href="@{/dochadzka}" th:classappend="${active == 'dochadzka'} ? 'active'">Dochádzka</a>
        <a th:unless="${canEdit}" th:href="@{/moja-dochadzka}" th:classappend="${active == 'dochadzka'} ? 'active'">Moja dochádzka</a>
        <a th:href="@{/polozky}" th:classappend="${active == 'polozky'} ? 'active'">Položky</a>
        <a th:href="@{/faktury}" th:classappend="${active == 'faktury'} ? 'active'">Faktúry</a>
        <a th:href="@{/majetok}" th:classappend="${active == 'majetok'} ? 'active'">Majetok</a>
        <a th:if="${canEdit}" th:href="@{/exporty}" th:classappend="${active == 'exporty'} ? 'active'">Exporty</a>
        <a th:href="@{/nastavenia}" th:classappend="${active == 'nastavenia'} ? 'active'">Nastavenia</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout">
        <span th:text="${currentUser}">user</span>
        <button type="submit" class="link">Odhlásiť</button>
    </form>
</header>
<span th:fragment="exports(base, query)" class="export-links">
    <a class="button" th:href="@{${base + '.xlsx' + query}}" title="Excel s číslami a dátumami">Excel</a>
    <a class="button" th:href="@{${base + '.pdf' + query}}" title="Na tlač a pre partnerov">PDF</a>
    <a class="button link" th:href="@{${base + '.csv' + query}}" title="Na import do iných nástrojov">CSV</a>
</span>
<section th:fragment="attachments(list, uploadUrl, restricted)" class="card" id="podklady">
    <h2>Podklady</h2>
    <p class="empty" th:if="${list.isEmpty()}">Zatiaľ žiadne súbory.</p>
    <ul class="files" th:unless="${list.isEmpty()}">
        <li th:each="f : ${list}">
            <a th:href="@{/prilohy/{id}(id=${f.id()})}" th:text="${f.fileName()}"></a>
            <span class="chip" th:text="${f.categoryLabel()}"></span>
            <span class="badge" th:if="${f.editorsOnly()}">len editori</span>
            <small class="muted" th:text="${f.sizeLabel()} + ' · ' + ${f.uploadedBy()} + ' · ' + ${#temporals.format(f.uploadedAt(), 'd. M. yyyy')}"></small>
            <form th:if="${canEdit}" class="inline" th:action="@{/prilohy/{id}/zmazat(id=${f.id()})}" method="post">
                <button type="submit" class="link danger" aria-label="Zmazať súbor">×</button>
            </form>
            <div class="note muted" th:if="${f.note() != null}" th:text="${f.note()}"></div>
        </li>
    </ul>
    <form th:if="${canEdit}" th:action="@{${uploadUrl}}" method="post" enctype="multipart/form-data" class="grid add-task">
        <label class="span2">Súbor (najviac 10 MB) <input type="file" name="file" required
               accept=".pdf,.docx,.xlsx,.pptx,.doc,.xls,.odt,.ods,.png,.jpg,.jpeg,.zip,.txt,.csv"></label>
        <label>Druh <select name="category">
            <option th:each="c : ${attachmentCategories}" th:value="${c.name()}" th:text="${c.label()}"></option>
        </select></label>
        <label class="check" th:unless="${restricted}"><input type="checkbox" name="editorsOnly" value="true"> len pre editorov</label>
        <label class="span2">Poznámka <input name="note" placeholder="verzia, odkaz na Drive s videom..."></label>
        <div><button type="submit" class="primary">Nahrať</button></div>
    </form>
</section>
<div th:fragment="messages">
    <p class="flash" th:if="${message}" th:text="${message}">Uložené.</p>
    <ul class="errors" th:if="${errors != null and !errors.isEmpty()}">
        <li th:each="e : ${errors}" th:text="${e}">Chyba</li>
    </ul>
</div>
</body>
</html>
