<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sk">
<head th:replace="~{fragments :: head(title='Faktúry')}"></head>
<body>
<header th:replace="~{fragments :: nav(active='faktury')}"></header>
<main>
    <div class="page-head">
        <h1>Faktúry a dobropisy</h1>
        <a class="button primary" th:href="@{/faktury/nova}">+ Nová faktúra</a>
    </div>
    <div th:replace="~{fragments :: messages}"></div>

    <p class="empty" th:if="${invoices.isEmpty()}">Zatiaľ žiadne faktúry.</p>
    <table th:unless="${invoices.isEmpty()}">
        <thead>
        <tr>
            <th>Číslo</th><th>Vystavená</th><th>Odberateľ</th><th>Projekt</th>
            <th class="num">Suma</th><th>Stav</th><th>E-faktúra</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${invoices}">
            <td><a th:href="@{/faktury/{id}(id=${s.id()})}" th:text="${s.number()}">20270001</a>
                <span th:if="${s.isCreditNote()}" class="badge">dobropis k <span th:text="${s.correctsNumber()}"></span></span></td>
            <td th:text="${#temporals.format(s.issueDate(), 'd. M. yyyy')}"></td>
            <td th:text="${s.buyerName()}"></td>
            <td th:text="${s.projectCode()} ?: '-'"></td>
            <td class="num" th:text="${#numbers.formatDecimal(s.signedTotal(), 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></td>
            <td>
                <span th:if="${s.paidOn() != null}" class="badge ok" th:text="${s.isCreditNote()} ? 'Vrátené' : 'Uhradená'">Uhradená</span>
                <span th:if="${s.paidOn() == null and s.isOverdue()}" class="badge bad">Po splatnosti</span>
                <span th:if="${s.paidOn() == null and !s.isOverdue()}" class="badge">Čaká na úhradu</span>
            </td>
            <td th:text="${s.hasUbl()} ? 'áno' : 'len PDF'"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
