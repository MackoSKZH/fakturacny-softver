<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sk">
<head th:replace="~{fragments :: head(title=(${s.isCreditNote()} ? 'Dobropis ' : 'Faktúra ') + ${s.number()})}"></head>
<body>
<header th:replace="~{fragments :: nav(active='faktury')}"></header>
<main>
    <div class="page-head">
        <h1><span th:text="${s.isCreditNote()} ? 'Dobropis' : 'Faktúra'"></span> <span th:text="${s.number()}"></span></h1>
        <div class="row">
            <a class="button" th:if="${canEdit and !s.isCreditNote()}" th:href="@{/faktury/{id}/dobropis(id=${s.id()})}">Vystaviť dobropis</a>
            <a class="button primary" th:href="@{/faktury/{id}/pdf(id=${s.id()})}" target="_blank">PDF</a>
            <a class="button" th:if="${s.hasUbl()}" th:href="@{/faktury/{id}/xml(id=${s.id()})}">E-faktúra (XML)</a>
        </div>
    </div>
    <div th:replace="~{fragments :: messages}"></div>

    <p class="warning" th:if="${s.isCreditNote()}">
        Opravný doklad k faktúre <a th:href="@{/faktury/{id}(id=${s.correctsId()})}" th:text="${s.correctsNumber()}"></a>.
        Dôvod: <span th:text="${s.correctionReason()}"></span></p>

    <section class="card">
        <div class="grid">
            <div><small>Odberateľ</small><strong th:text="${inv.buyer().name()}"></strong>
                <span th:text="${inv.buyer().street()}"></span>
                <span th:text="${inv.buyer().postalCode()} + ' ' + ${inv.buyer().city()}"></span></div>
            <div><small>Vystavená</small><strong th:text="${#temporals.format(inv.issueDate(), 'd. M. yyyy')}"></strong></div>
            <div><small>Dodanie</small><strong th:text="${#temporals.format(inv.deliveryDate(), 'd. M. yyyy')}"></strong></div>
            <div><small>Splatnosť</small><strong th:text="${#temporals.format(inv.dueDate(), 'd. M. yyyy')}"></strong></div>
            <div><small>Variabilný symbol</small><strong th:text="${inv.variableSymbol()} ?: '-'"></strong></div>
            <div><small>Projekt</small><strong th:text="${inv.projectCode()} ?: '-'"></strong></div>
            <div><small>Dodávateľ</small><strong th:text="${inv.seller().name()}"></strong></div>
            <div><small>E-faktúra</small><strong th:text="${s.hasUbl()} ? 'áno (Peppol BIS 3.0)' : 'nie - odberateľ nemá DIČ'"></strong></div>
        </div>
    </section>

    <table>
        <thead><tr><th>Popis</th><th class="num">Množstvo</th><th class="num">Cena/MJ</th><th class="num">Spolu bez DPH</th></tr></thead>
        <tbody>
        <tr th:each="l : ${inv.lines()}">
            <td th:text="${l.description()}"></td>
            <td class="num" th:text="${l.quantity().stripTrailingZeros().toPlainString()}"></td>
            <td class="num" th:text="${#numbers.formatDecimal(l.unitPrice(), 1, 'WHITESPACE', 2, 'COMMA')}"></td>
            <td class="num" th:text="${#numbers.formatDecimal(l.netAmount(), 1, 'WHITESPACE', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
    </table>
    <dl class="sums">
        <dt>Bez DPH</dt><dd th:text="${#numbers.formatDecimal(totals.lineExtensionAmount(), 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></dd>
        <th:block th:if="${inv.seller().isVatRegistered()}">
            <dt>DPH</dt><dd th:text="${#numbers.formatDecimal(totals.vatAmount(), 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></dd>
        </th:block>
        <dt th:text="${s.isCreditNote()} ? 'Na vrátenie' : 'Na úhradu'">Na úhradu</dt><dd><strong th:text="${#numbers.formatDecimal(totals.payableAmount(), 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></strong></dd>
    </dl>

    <section class="card" th:if="${!creditNotes.isEmpty()}">
        <h2>Dobropisy k tejto faktúre</h2>
        <table>
            <thead><tr><th>Číslo</th><th>Vystavený</th><th>Dôvod</th><th class="num">Suma</th></tr></thead>
            <tbody>
            <tr th:each="c : ${creditNotes}">
                <td><a th:href="@{/faktury/{id}(id=${c.id()})}" th:text="${c.number()}"></a></td>
                <td th:text="${#temporals.format(c.issueDate(), 'd. M. yyyy')}"></td>
                <td th:text="${c.correctionReason()}"></td>
                <td class="num" th:text="'-' + ${#numbers.formatDecimal(c.totalPayable(), 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2 th:text="${s.isCreditNote()} ? 'Vrátenie peňazí' : 'Úhrada'">Úhrada</h2>
        <p th:if="${s.paidOn() != null}"><span th:text="${s.isCreditNote()} ? 'Vrátené' : 'Uhradená'"></span> <strong th:text="${#temporals.format(s.paidOn(), 'd. M. yyyy')}"></strong></p>
        <form th:if="${canEdit and s.paidOn() == null}" th:action="@{/faktury/{id}/uhrada(id=${s.id()})}" method="post" class="row">
            <label>Dátum <input type="date" name="paidOn" required></label>
            <button type="submit" class="primary" th:text="${s.isCreditNote()} ? 'Označiť ako vrátené' : 'Označiť ako uhradenú'">Označiť ako uhradenú</button>
        </form>
        <form th:if="${canEdit and s.paidOn() != null}" th:action="@{/faktury/{id}/uhrada(id=${s.id()})}" method="post">
            <button type="submit" class="link">Zrušiť úhradu</button>
        </form>
    </section>
</main>
</body>
</html>
