<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sk">
<head th:replace="~{fragments :: head(title='Projekty')}"></head>
<body>
<header th:replace="~{fragments :: nav(active='projekty')}"></header>
<main>
    <h1>Projekty a rozpočty</h1>
    <div th:replace="~{fragments :: messages}"></div>
    <p class="muted">Zatiaľ sa započítavajú len vystavené faktúry (príjmy). Výdavky pribudnú s prijatými
        e-faktúrami a bankovým výpisom.</p>
    <table th:unless="${projects.isEmpty()}">
        <thead><tr><th>Kód</th><th>Názov</th><th class="num">Rozpočet</th><th class="num">Vyfakturované</th><th>Plnenie</th></tr></thead>
        <tbody>
        <tr th:each="p : ${projects}">
            <td th:text="${p.code()}"></td>
            <td th:text="${p.name()}"></td>
            <td class="num" th:text="${#numbers.formatDecimal(p.budget(), 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></td>
            <td class="num" th:text="${#numbers.formatDecimal(p.invoiced(), 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></td>
            <td><progress th:if="${p.budget().signum() > 0}" th:value="${p.invoiced()}" th:max="${p.budget()}"></progress></td>
        </tr>
        </tbody>
    </table>

    <section class="card">
        <h2>Nový projekt</h2>
        <form th:action="@{/projekty}" method="post" class="grid">
            <label>Kód <input name="code" required placeholder="FGC-2027"></label>
            <label>Názov <input name="name" required placeholder="FIRST Global Challenge 2027"></label>
            <label>Rozpočet (€) <input name="budget" inputmode="decimal" value="0"></label>
            <div><button type="submit" class="primary">Vytvoriť projekt</button></div>
        </form>
    </section>
</main>
</body>
</html>
