spring:
  application:
    name: fgs-hq
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ucto}
    username: ${DATABASE_USER:ucto}
    password: ${DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  mvc:
    format:
      date: iso
  servlet:
    multipart:
      # Prilohy maju limit 10 MB v AttachmentService (s peknou hlaskou). Tu je rezerva, aby sa subor 10-50 MB
      # vobec nacital a pouzivatel dostal vysvetlenie; nad 50 MB ukaze Spring stranku error/413.
      max-file-size: 50MB
      max-request-size: 51MB

server:
  forward-headers-strategy: framework
  tomcat:
    # pri prilis velkom subore dorucit peknu chybu namiesto zhodeneho spojenia
    max-swallow-size: 60MB
  servlet:
    session:
      timeout: 8h
      cookie:
        secure: ${COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    # local = jeden lokalny ucet (na skusanie); produkcia: profil "google" (application-google.yml)
    mode: ${APP_SECURITY_MODE:local}
    allowed-emails: ${APP_ALLOWED_EMAILS:}
    allowed-domains: ${APP_ALLOWED_DOMAINS:}
    local-username: ${APP_LOCAL_USERNAME:admin}
    local-password: ${APP_LOCAL_PASSWORD:}
    # len lokalny rezim: ciarkou oddeleni pouzivatelia na citanie (rovnake heslo), napr. eva@demo.example
    local-readers: ${APP_LOCAL_READERS:}
    # rola pre ucet, ktory sa prihlasi prvy raz bez pozvanky (povoleny e-mailom/domenou); najmenej prav = DOBROVOLNIK
    default-role: ${APP_DEFAULT_ROLE:DOBROVOLNIK}
    # ucty, ktore smu vystavovat doklady a menit udaje; ostatni povoleni len citaju
    editor-emails: ${APP_EDITOR_EMAILS:}
