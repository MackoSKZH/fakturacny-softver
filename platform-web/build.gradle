plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation project(':platform-core')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // Skutocny PostgreSQL bez Dockeru (funguje aj na Windows); da sa prebit premennou TEST_DATABASE_URL
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation platform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.15.0')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
    // Postgres nesmie bezat ako root - lokalne ho mozno nahradit existujucou DB
    environment 'TEST_DATABASE_URL', System.getenv('TEST_DATABASE_URL') ?: ''
}
