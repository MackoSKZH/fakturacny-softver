# Vyskusanie na vlastnom pocitaci (Docker Desktop) - ukazkove data, bez Google a bez domeny.
#   docker compose -f docker-compose.demo.yml up --build
#   http://localhost:8080  ->  pokladnik / demo-heslo-2027   (admin, vidi a meni vsetko)
#   dalsie ucty s tym istym heslom: peter@ (projektovy manazer, vlastni narodne kolo), jana@ (koordinatorka),
#   eva@ (dobrovolnicka), marek@ (mentor), financie@, rada@  - vsetky @demo.example
#   Odkaz na demo pozvanku je v logu: docker compose -f docker-compose.demo.yml logs app | grep Pozvanka
# Zmazanie vsetkych demo dat:  docker compose -f docker-compose.demo.yml down -v
# Nie je to produkcia: jedno spolocne heslo, bez HTTPS, pristup len z tohto pocitaca (127.0.0.1).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fgs_hq
      POSTGRES_USER: fgs
      POSTGRES_PASSWORD: demo-db-heslo
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fgs -d fgs_hq"]
      interval: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fgs_hq
      DATABASE_USER: fgs
      DATABASE_PASSWORD: demo-db-heslo
      SPRING_PROFILES_ACTIVE: demo
      APP_SECURITY_MODE: local
      APP_LOCAL_USERNAME: pokladnik
      APP_LOCAL_PASSWORD: demo-heslo-2027
      COOKIE_SECURE: "false"

volumes:
  demo-db:
